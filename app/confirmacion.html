<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechStore | Pedido confirmado</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="confirmacion">
  <header id="site-header" class="site-header"></header>

  <main>
    <div id="content" class="card" style="max-width:760px;margin:0 auto"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/orders-view.js"></script>
  <script>
    UI.init({ active: 'pedidos', protected: true });
    if (UI.requireAuth()) {
      var o = Checkout.getOrder(UI.qs('id'));
      var c = document.getElementById('content');
      if (!o) {
        c.innerHTML = '<div class="empty"><h1>Pedido no encontrado</h1><a class="btn btn-primary" href="pedidos.html">Ver mis pedidos</a></div>';
      } else {
        c.innerHTML =
          '<div class="success-hero" data-testid="order-confirmation"><div class="icon">✅</div>' +
          '<h1>¡Gracias por tu compra!</h1>' +
          '<p>Tu pedido <strong data-testid="order-id">' + UI.esc(o.id) + '</strong> fue registrado el ' + OrderView.fmtDate(o.date) + '</p>' +
          '<p class="muted">Enviamos (de forma simulada) el comprobante a <strong>' + UI.esc(o.email) + '</strong>.</p></div>' +
          OrderView.detail(o) +
          '<div class="step-actions"><a class="btn btn-outline" href="pedidos.html" data-testid="go-orders">Ver mis pedidos</a>' +
          '<a class="btn btn-primary" href="index.html" data-testid="continue-shopping">Seguir comprando</a></div>';
      }
    }
  </script>
</body>
</html>
